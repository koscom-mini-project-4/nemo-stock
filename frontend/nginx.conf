server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router(createWebHistory) SPA 라우트: 실제 파일/디렉토리가 있으면 그대로 서빙하고
    # (예: /presentation/ 하위의 정적 프레젠테이션 페이지), 없을 때만 index.html로 폴백한다.
    # `serve -s`의 무조건 rewrite(파일 존재 여부 무시)와 달리, try_files는 실제 존재를
    # 먼저 확인하므로 새로고침 404와 정적 서브패스 접근 두 요구를 동시에 만족한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
