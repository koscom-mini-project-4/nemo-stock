services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nemo-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # SQLite DB 파일을 호스트와 바인딩하여 컨테이너 재시작 후에도 유저/데이터 유지
      - ./backend/nemo_stock.db:/app/nemo_stock.db
      - ./backend/nemo-stock.md:/app/nemo-stock.md
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nemo-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
